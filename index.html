<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="वेब चैट (Web Chat) - सुरक्षित और प्राइवेट मैसेंजर।">
    <title>वेब चैट - Rathore Private Messenger</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Roboto', sans-serif; }
        html, body { height: 100%; background: #f0f2f5; }
        .hidden { display: none !important; }

        #login-screen { background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.1); text-align: center; width: 90%; max-width: 400px; margin: 50px auto; }
        #login-screen h2 { color: #000; margin-bottom: 20px; font-size: 2rem; }
        .input-box { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; outline: none; }
        .btn { background: #000; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 1.05rem; cursor: pointer; margin-top: 10px; font-weight: 600; }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .btn.secondary { background: #fff; color: #000; border: 1px solid #000; }
        #auth-error { color: #d9534f; font-size: .9rem; margin-top: 4px; min-height: 1.3em; }

        #app-container { width: 100%; max-width: 1200px; height: 100vh; height: 100dvh; background: #fff; display: flex; overflow: hidden; margin: 0 auto; box-shadow: 0 0 10px rgba(0,0,0,.05); }

        #sidebar { width: 35%; min-width: 320px; background: #fff; border-right: 1px solid #e9edef; display: flex; flex-direction: column; position: relative; }
        .wa-top-header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px 10px; }
        .wa-top-header h2 { font-size: 1.5rem; font-weight: 700; color: #111b21; }
        .wa-top-icons { display: flex; gap: 20px; color: #111b21; font-size: 1.2rem; }
        .wa-top-icons i { cursor: pointer; }
        .wa-search-container { padding: 0 15px 10px; }
        .wa-search-box { background: #f0f2f5; border-radius: 30px; display: flex; align-items: center; padding: 8px 15px; height: 40px; }
        .wa-search-box i { color: #54656f; font-size: .9rem; margin-right: 15px; }
        .wa-search-box input { border: none; background: transparent; outline: none; width: 100%; font-size: .95rem; color: #111b21; }
        .wa-filters { display: flex; gap: 8px; padding: 0 15px 10px; overflow-x: auto; border-bottom: 1px solid #e9edef; white-space: nowrap; }
        .wa-filters::-webkit-scrollbar { display: none; }
        .wa-chip { background: #f0f2f5; color: #54656f; padding: 6px 14px; border-radius: 20px; font-size: .9rem; cursor: pointer; font-weight: 500; }
        .wa-chip.active { background: #fce8e8; color: #e91e63; }

        .contact-list { flex: 1; overflow-y: auto; list-style: none; padding-bottom: 150px; }
        .contact-item { padding: 12px 15px; display: flex; align-items: center; cursor: pointer; transition: .2s; }
        .contact-item:hover, .contact-item.active { background: #f5f6f6; }
        .contact-item img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; margin-right: 15px; flex-shrink: 0; }
        .contact-details { flex: 1; min-width: 0; border-bottom: 1px solid #f2f2f2; padding-bottom: 12px; }
        .contact-name { display: block; font-size: 1.05rem; font-weight: 500; color: #111b21; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 3px; }
        .contact-sub { display: block; font-size: .85rem; color: #667781; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .no-contacts { padding: 30px 20px; text-align: center; color: #667781; font-size: .9rem; }

        .wa-fab { position: absolute; bottom: 80px; right: 20px; width: 50px; height: 50px; background: #e91e63; color: #fff; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 1.5rem; border: none; cursor: pointer; box-shadow: 0 4px 10px rgba(233,30,99,.3); z-index: 10; }
        .wa-bottom-nav { position: absolute; bottom: 0; width: 100%; background: #fff; border-top: 1px solid #e9edef; display: flex; justify-content: space-around; align-items: center; padding: 10px 0; z-index: 10; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #54656f; font-size: .75rem; cursor: pointer; gap: 4px; font-weight: 500; }
        .nav-item i { font-size: 1.4rem; padding: 4px 15px; border-radius: 20px; }
        .nav-item.active { color: #111b21; }
        .nav-item.active i { background: #fce8e8; color: #e91e63; }

        #chat-window { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #efe7dd url('https://www.transparenttextures.com/patterns/cubes.png'); }
        #empty-chat { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #f0f2f5; color: #667781; text-align: center; padding: 20px; }
        #active-chat { display: none; flex: 1; min-height: 0; flex-direction: column; }
        .chat-header { background: #f0f2f5; padding: 10px 15px; display: flex; align-items: center; gap: 15px; border-bottom: 1px solid #e9edef; }
        .chat-header img { width: 40px; height: 40px; border-radius: 50%; }
        .chat-header-info { min-width: 0; }
        .chat-header-info h3 { font-size: 1rem; color: #111b21; font-weight: 500; }
        .chat-header-info p { font-size: .8rem; color: #667781; }
        #back-btn { display: none; background: none; border: none; font-size: 1.2rem; color: #54656f; cursor: pointer; margin-right: 5px; }

        .chat-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 75%; padding: 8px 12px; border-radius: 8px; font-size: .95rem; color: #111b21; overflow-wrap: anywhere; white-space: pre-wrap; box-shadow: 0 1px .5px rgba(11,20,26,.13); }
        .message.received { background: #fff; align-self: flex-start; border-top-left-radius: 0; }
        .message.sent { background: #d9fdd3; align-self: flex-end; border-top-right-radius: 0; }
        .msg-time { font-size: .65rem; color: #667781; float: right; margin: 8px 0 -5px 10px; }

        .input-area { background: #f0f2f5; padding: 10px 15px; display: flex; align-items: center; gap: 10px; }
        .input-area input { flex: 1; min-width: 0; padding: 12px 15px; border: none; border-radius: 8px; font-size: .95rem; outline: none; background: #fff; }
        .send-btn { background: #00a884; color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; }

        #toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #111b21; color: #fff; padding: 10px 18px; border-radius: 20px; font-size: .9rem; opacity: 0; pointer-events: none; transition: .3s; z-index: 50; }
        #toast.show { opacity: 1; }

        @media screen and (max-width: 768px) {
            #app-container { max-width: none; box-shadow: none; }
            #sidebar { width: 100%; min-width: 0; border: none; }
            #chat-window { display: none; width: 100%; }
            #back-btn { display: block; }
            .chat-area { padding: 15px 10px; }
            .message { max-width: 85%; }
            #app-container.chat-open #sidebar { display: none; }
            #app-container.chat-open #chat-window { display: flex; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Web Chat</h2>
        <p style="color:#666; margin-bottom: 10px;">लॉगिन या साइन अप करें</p>
        <input type="email" id="email" class="input-box" placeholder="Aapki Email ID" autocomplete="email">
        <input type="password" id="password" class="input-box" placeholder="Password (min 6 letters)" autocomplete="current-password">
        <p id="auth-error"></p>
        <button class="btn" id="login-btn">Login</button>
        <button class="btn secondary" id="signup-btn">Naya Account Banayein</button>
    </div>

    <div id="app-container" class="hidden">
        <div id="sidebar">
            <div class="wa-top-header">
                <h2>Web Chat</h2>
                <div class="wa-top-icons">
                    <i class="fas fa-camera" data-soon></i>
                    <i class="fas fa-sign-out-alt" id="logout-btn" title="Logout"></i>
                </div>
            </div>
            <div class="wa-search-container">
                <div class="wa-search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="search-input" placeholder="सर्च करें" autocomplete="off">
                </div>
            </div>
            <div class="wa-filters">
                <span class="wa-chip active">सभी</span>
                <span class="wa-chip" data-soon>नहीं पढ़ा</span>
                <span class="wa-chip" data-soon>पसंदीदा</span>
                <span class="wa-chip" data-soon>ग्रुप्स</span>
            </div>
            <ul class="contact-list" id="contact-list"></ul>
            <button class="wa-fab" id="add-friend-btn" title="Dost Jodein"><i class="fas fa-plus"></i></button>
            <div class="wa-bottom-nav">
                <div class="nav-item active"><i class="fas fa-comment"></i><span>चैट</span></div>
                <div class="nav-item" data-soon><i class="fas fa-sync"></i><span>अपडेट्स</span></div>
                <div class="nav-item" data-soon><i class="fas fa-users"></i><span>कम्युनिटी</span></div>
                <div class="nav-item" data-soon><i class="fas fa-phone"></i><span>कॉल्स</span></div>
            </div>
        </div>

        <div id="chat-window">
            <div id="empty-chat">
                <h2 style="color:#41525d; font-weight:300;">Web Chat</h2>
                <p style="margin-top:10px;">Private message bhejne ke liye list se kisi dost ko chunein.</p>
            </div>
            <div id="active-chat">
                <div class="chat-header">
                    <button id="back-btn" title="Wapas"><i class="fas fa-arrow-left"></i></button>
                    <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="">
                    <div class="chat-header-info">
                        <h3 id="chat-friend-name"></h3>
                        <p id="chat-friend-email"></p>
                    </div>
                </div>
                <div class="chat-area" id="chat-area"></div>
                <div class="input-area">
                    <i class="fas fa-smile" data-soon style="font-size:1.5rem; color:#54656f; cursor:pointer;"></i>
                    <input type="text" id="msg-input" placeholder="मैसेज टाइप करें..." maxlength="2000" autocomplete="off">
                    <button class="send-btn" id="send-btn" title="Bhejein"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBrqb-PgLn6o_lCpjZ5S4m0njY_e4N6qPw",
            authDomain: "web-chat-1fc92.firebaseapp.com",
            projectId: "web-chat-1fc92",
            storageBucket: "web-chat-1fc92.firebasestorage.app",
            messagingSenderId: "701338081272",
            appId: "1:701338081272:web:aa0e2251e2869c9fd7e80d"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        db.settings({ experimentalAutoDetectLongPolling: true, merge: true });

        let myEmail = null, currentChatId = null, currentFriendEmail = null;
        let unsubscribeChat = null, unsubscribeContacts = null, unsubscribeIncoming = null;
        let contactsMap = {}, incomingMap = {}, searchTerm = '', toastTimer;

        const $ = (id) => document.getElementById(id);
        const appContainer = $('app-container');
        const AVATAR = 'https://cdn-icons-png.flaticon.com/512/149/149071.png';

        const normalizeEmail = (e) => (e || '').trim().toLowerCase();
        const getChatId = (a, b) => (a < b ? a + '|' + b : b + '|' + a);

        function toast(msg) {
            const t = $('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        function authMessage(code) {
            const map = {
                'auth/invalid-email': 'Email ID sahi nahi hai.',
                'auth/email-already-in-use': 'Yeh email pehle se registered hai. Login karein.',
                'auth/weak-password': 'Password kam se kam 6 akshar ka rakhein.',
                'auth/user-not-found': 'Email ya Password galat hai.',
                'auth/wrong-password': 'Email ya Password galat hai.',
                'auth/invalid-credential': 'Email ya Password galat hai.',
                'auth/too-many-requests': 'Bahut koshish ho gayi, thodi der baad try karein.',
                'auth/network-request-failed': 'Internet connection check karein.'
            };
            return map[code] || 'Kuch galat ho gaya. Dobara try karein.';
        }

        function readCreds() {
            const email = normalizeEmail($('email').value);
            const password = $('password').value;
            if (!email || !password) { $('auth-error').textContent = 'Email aur password dalein!'; return null; }
            $('auth-error').textContent = '';
            return { email, password };
        }

        async function authAction(fn) {
            const c = readCreds(); if (!c) return;
            $('login-btn').disabled = $('signup-btn').disabled = true;
            try { await fn(c.email, c.password); }
            catch (err) { $('auth-error').textContent = authMessage(err.code); }
            $('login-btn').disabled = $('signup-btn').disabled = false;
        }
        const loginUser = () => authAction((e, p) => auth.signInWithEmailAndPassword(e, p));
        const signUpUser = () => authAction((e, p) => auth.createUserWithEmailAndPassword(e, p));

        auth.onAuthStateChanged((user) => {
            if (user) {
                myEmail = normalizeEmail(user.email);
                $('login-screen').classList.add('hidden');
                appContainer.classList.remove('hidden');
                resetChatView();
                loadContacts();
            } else {
                myEmail = null;
                [unsubscribeChat, unsubscribeContacts, unsubscribeIncoming].forEach((u) => u && u());
                unsubscribeChat = unsubscribeContacts = unsubscribeIncoming = null;
                contactsMap = {}; incomingMap = {};
                resetChatView();
                $('contact-list').innerHTML = '';
                $('password').value = '';
                appContainer.classList.add('hidden');
                $('login-screen').classList.remove('hidden');
            }
        });

        async function addFriend() {
            const friendEmail = normalizeEmail(prompt('Dost ki Email ID dalein:'));
            if (!friendEmail) return;
            if (!/^[^\s@|]+@[^\s@|]+\.[^\s@|]+$/.test(friendEmail)) return alert('Email ID sahi nahi hai.');
            if (friendEmail === myEmail) return alert('Aap khud ko add nahi kar sakte.');
            const friendName = (prompt('Dost ka naam:') || '').trim();
            if (!friendName) return;
            try {
                await db.collection('users').doc(myEmail).collection('contacts').doc(friendEmail).set({ email: friendEmail, name: friendName });
                try {
                    await db.collection('users').doc(friendEmail).collection('incoming').doc(myEmail).set({ email: myEmail, name: myEmail.split('@')[0] });
                } catch (e) { console.warn('incoming write failed', e); }
                toast(friendName + ' add ho gaya!');
            } catch (err) {
                console.error(err);
                alert('Dost add nahi ho paya (' + err.code + ').');
            }
        }

        function renderContacts() {
            const list = $('contact-list');
            list.innerHTML = '';
            let contacts = Object.values(Object.assign({}, incomingMap, contactsMap));
            const total = contacts.length;
            if (searchTerm) {
                contacts = contacts.filter((c) => (c.name + ' ' + c.email).toLowerCase().includes(searchTerm));
            }
            if (contacts.length === 0) {
                const li = document.createElement('li');
                li.className = 'no-contacts';
                li.textContent = total === 0 ? 'Abhi koi dost nahi hai. Neeche + dabakar dost jodein.' : 'Koi nahi mila.';
                list.appendChild(li);
                return;
            }
            contacts.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            contacts.forEach((contact) => {
                const li = document.createElement('li');
                li.className = 'contact-item' + (contact.email === currentFriendEmail ? ' active' : '');

                const img = document.createElement('img');
                img.src = AVATAR; img.alt = '';
                const details = document.createElement('div');
                details.className = 'contact-details';
                const name = document.createElement('span');
                name.className = 'contact-name';
                name.textContent = contact.name;
                const sub = document.createElement('span');
                sub.className = 'contact-sub';
                sub.textContent = contact.email;

                details.append(name, sub);
                li.append(img, details);
                li.addEventListener('click', () => openChat(contact.email, contact.name));
                list.appendChild(li);
            });
        }

        function loadContacts() {
            if (unsubscribeContacts) unsubscribeContacts();
            if (unsubscribeIncoming) unsubscribeIncoming();
            const userDoc = db.collection('users').doc(myEmail);
            const onErr = (err) => { console.error(err); toast('Contacts load nahi hue (' + err.code + ')'); };
            unsubscribeContacts = userDoc.collection('contacts').onSnapshot((snap) => {
                contactsMap = {}; snap.forEach((d) => { contactsMap[d.id] = d.data(); }); renderContacts();
            }, onErr);
            unsubscribeIncoming = userDoc.collection('incoming').onSnapshot((snap) => {
                incomingMap = {}; snap.forEach((d) => { incomingMap[d.id] = d.data(); }); renderContacts();
            }, onErr);
        }

        function resetChatView() {
            if (unsubscribeChat) { unsubscribeChat(); unsubscribeChat = null; }
            currentChatId = null;
            currentFriendEmail = null;
            $('active-chat').style.display = 'none';
            $('empty-chat').style.display = 'flex';
            $('chat-area').innerHTML = '';
            appContainer.classList.remove('chat-open');
        }

        function openChat(friendEmail, friendName) {
            currentFriendEmail = friendEmail;
            currentChatId = getChatId(myEmail, friendEmail);
            $('empty-chat').style.display = 'none';
            $('active-chat').style.display = 'flex';
            $('chat-friend-name').textContent = friendName;
            $('chat-friend-email').textContent = friendEmail;
            appContainer.classList.add('chat-open');
            renderContacts();

            if (unsubscribeChat) unsubscribeChat();
            const chatArea = $('chat-area');
            chatArea.innerHTML = '';

            unsubscribeChat = db.collection('private_chats').doc(currentChatId).collection('messages').orderBy('timestamp')
                .onSnapshot((snapshot) => {
                    chatArea.innerHTML = '';
                    snapshot.forEach((doc) => {
                        const data = doc.data({ serverTimestamps: 'estimate' });
                        const div = document.createElement('div');
                        div.className = 'message ' + (data.sender === myEmail ? 'sent' : 'received');
                        div.appendChild(document.createTextNode(data.text));
                        const time = document.createElement('span');
                        time.className = 'msg-time';
                        time.textContent = data.timestamp ? data.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '...';
                        div.appendChild(time);
                        chatArea.appendChild(div);
                    });
                    chatArea.scrollTop = chatArea.scrollHeight;
                }, (err) => {
                    console.error(err);
                    chatArea.textContent = 'Messages load nahi hue (' + err.code + ').';
                });

            if (window.innerWidth > 768) $('msg-input').focus();
        }

        function showSidebar() {
            resetChatView();
            renderContacts();
        }

        async function sendMessage() {
            const input = $('msg-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;
            input.value = '';
            try {
                await db.collection('private_chats').doc(currentChatId).collection('messages').add({
                    text: text,
                    sender: myEmail,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (err) {
                console.error(err);
                input.value = text;
                alert('Message nahi gaya (' + err.code + '). Internet ya Firestore Rules check karein.');
            }
        }

        // ===== Event listeners =====
        $('login-btn').addEventListener('click', loginUser);
        $('signup-btn').addEventListener('click', signUpUser);
        $('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') loginUser(); });
        $('email').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('password').focus(); });
        $('logout-btn').addEventListener('click', () => auth.signOut());
        $('add-friend-btn').addEventListener('click', addFriend);
        $('back-btn').addEventListener('click', showSidebar);
        $('send-btn').addEventListener('click', sendMessage);
        $('msg-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });
        $('search-input').addEventListener('input', (e) => { searchTerm = e.target.value.trim().toLowerCase(); renderContacts(); });
        document.querySelectorAll('[data-soon]').forEach((el) => el.addEventListener('click', () => toast('यह फीचर जल्द आएगा')));
    </script>
</body>
</html>
